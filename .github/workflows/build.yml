name: Build

on:
  push:
    branches: [master, main]
    tags: ["v*"]
  pull_request:
    branches: [master, main]
  workflow_dispatch:

permissions:
  contents: write

env:
  CARGO_TERM_COLOR: always
  CARGO_INCREMENTAL: 0

jobs:
  # 构建产物: Linux 使用 musl 静态链接, Windows / macOS 使用原生 target
  build:
    name: 构建 ${{ matrix.target }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            target: x86_64-unknown-linux-musl
            artifact: http-mock-server-linux-x86_64-musl
            cross: true
          - os: ubuntu-latest
            target: aarch64-unknown-linux-musl
            artifact: http-mock-server-linux-aarch64-musl
            cross: true
          - os: windows-latest
            target: x86_64-pc-windows-msvc
            artifact: http-mock-server-windows-x86_64
            cross: false
          - os: macos-latest
            target: aarch64-apple-darwin
            artifact: http-mock-server-macos-aarch64
            cross: false

    steps:
      - name: 检出代码
        uses: actions/checkout@v4

      - name: 安装 Rust 工具链
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: 缓存 cargo 依赖
        uses: Swatinem/rust-cache@v2
        with:
          key: ${{ matrix.target }}

      # cross 通过容器提供 musl 工具链与交叉链接器 (静态链接, 无 glibc 依赖)
      - name: 安装 cross
        if: matrix.cross
        uses: taiki-e/install-action@v2
        with:
          tool: cross

      - name: 构建 (musl, 静态链接)
        if: matrix.cross
        run: cross build --release --locked --target ${{ matrix.target }}

      - name: 构建 (原生)
        if: ${{ !matrix.cross }}
        run: cargo build --release --locked --target ${{ matrix.target }}

      - name: 整理产物
        shell: bash
        run: |
          BIN="target/${{ matrix.target }}/release/http-mock-server"
          mkdir -p dist
          if [ -f "${BIN}.exe" ]; then
            cp "${BIN}.exe" "dist/${{ matrix.artifact }}.exe"
          else
            cp "${BIN}" "dist/${{ matrix.artifact }}"
            chmod +x "dist/${{ matrix.artifact }}"
          fi

      - name: 上传构建产物
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact }}
          path: dist/*
          if-no-files-found: error

  # 打 tag 时把所有产物汇总发布到一个 Release
  release:
    name: 发布 Release
    needs: build
    if: startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-latest
    steps:
      - name: 下载全部构建产物
        uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true

      - name: 发布
        uses: softprops/action-gh-release@v2
        with:
          files: dist/*
          generate_release_notes: true
